# 검사 자동화. 배포는 하지 않는다(배포 절차는 docs/배포안내.md, 사람이 직접 한다).
# - check: 타입 검사 → 코드 검사 → 디자인 규칙 검사 → 단위·통합 테스트 → 화면 빌드 → 번들 크기 검사
# - e2e:   로컬 D1 + wrangler dev를 띄워 브라우저 흐름 테스트(Chromium만)
# 액션 버전(2026-11-08 각 저장소 action.yml에서 확인, 모두 runs.using: node24):
#   checkout v7 · setup-node v7 · cache v6 · upload-artifact v7
name: CI

on:
  # push는 main만. 다른 가지의 변경은 PR(pull_request)로 한 번만 돈다(같은 커밋을 두 번 돌리지 않게).
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # styles.css의 디자인 규칙(CLAUDE.md) 밖 값. 하나라도 있으면 실패(배포 전 점검도 같은 검사를 부른다).
      - run: npm run audit:design
      # 이 저장소의 테스트는 Workers 실행 환경(@cloudflare/vitest-plugin)을 띄워 기본 5초 제한을 넘길 수 있다.
      - run: npx vitest run --testTimeout=30000
      - run: npm run build
      - run: npm run check:bundle

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright 브라우저(~/.cache/ms-playwright)를 Playwright 버전별로 캐시한다. 적중하면 브라우저 내려받기를 건너뛰고
      # 시스템 의존 패키지(apt, 캐시 대상 아님)만 설치한다.
      - name: Playwright 버전
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # 로컬 비밀값 파일(.dev.vars)은 git에 없다. 가짜 로그인의 세션 서명에 SESSION_SECRET이 필요하므로
      # 실행마다 새 값을 만든다(이 값은 CI 안의 로컬 서버에서만 쓰고 버린다. 운영 비밀값과 무관).
      - name: .dev.vars 만들기
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" > .dev.vars
      # playwright.config.ts의 webServer가 npm run dev(화면 빌드 → 로컬 D1 마이그레이션 → wrangler dev)를 띄운다.
      - run: npm run e2e
        env:
          CI: "true"
      # 실패한 테스트의 추적(trace.zip)·스크린숏(playwright.config.ts use.trace·screenshot)이 test-results/에 남는다.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
