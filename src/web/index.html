<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      검색 노출: noindex는 운영 빌드(npm run deploy:production)에서만 빌드가 지운다. staging·로컬은 그대로 막힌다.
      canonical·og:url은 빌드가 운영 주소로 넣는다. 둘 다 scripts/search-index-plugin.mjs.
      제목·설명은 검색 결과와 카카오톡 공유 미리보기에 그대로 보인다.
    -->
    <meta name="robots" content="noindex" />
    <title>내전 기록 · 팀 짜기와 전적 관리 | 내전로그</title>
    <meta
      name="description"
      content="5:5 내전 기록 사이트. 티어로 실력을 맞춰 팀을 짜고, 경기 결과를 남기면 모임의 전적·승률 랭킹·개인 통계가 쌓여요."
    />
    <!-- 구글 서치 콘솔 소유권 확인(운영 주소, 2026-11-11). 지우면 서치 콘솔 소유권이 풀린다. -->
    <meta name="google-site-verification" content="OfTKrGAzOLyUPv4KM_vve0Z3yWbkBY0zY69sCetO69o" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="내전로그" />
    <meta property="og:title" content="내전 기록 · 팀 짜기와 전적 관리 | 내전로그" />
    <meta
      property="og:description"
      content="내전 팀 짜기, 경기 기록, 전적 검색과 승률 랭킹을 한곳에서. 참가자는 로그인 없이 링크로 기록을 봐요."
    />
    <!-- 탭·즐겨찾기·아이폰 홈 화면 아이콘. 그림은 scripts/make-icons.mjs가 만든다. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 미리보기 사진(og:image와 크기·설명)은 운영 주소가 필요해서 빌드가 넣는다(scripts/search-index-plugin.mjs). -->
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      글꼴(Pretendard Variable v1.3.9, OFL, 라이선스는 같은 폴더 LICENSE.txt). 같은 출처에서 내보내 외부 CDN 연결을 기다리지 않는다.
      글자 범위별 조각(dynamic subset)이라 화면에 나온 글자의 조각만 받는다. 받기 전에는 기기 글꼴로 보였다가 바뀐다(font-display: swap).
      예전에는 jsDelivr의 굵기별 전체 파일(굵기당 약 770KB)을 받았다. 파일 출처와 옮긴 방법은 pretendard.css 머리 주석.
    -->
    <link rel="stylesheet" href="/fonts/pretendard-1.3.9/pretendard.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
